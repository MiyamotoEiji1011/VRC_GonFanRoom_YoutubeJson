name: Update Social Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Update social stats
        run: python scripts/fetch_social_stats.py

      - name: Commit updated stats
        run: |
          git config user.name "social-stats-bot"
          git config user.email "social-stats-bot@users.noreply.github.com"

          git add docs/social_stats.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update social stats"
          git push
